<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>栀子花 · 音乐播放器</title>
    <!-- Font Awesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', '宋体', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #f7f3ed 0%, #e6ede4 50%, #dce8d6 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ===== 背景：飘落的花瓣 ===== */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -80px;
            width: 28px;
            height: 38px;
            background: radial-gradient(ellipse at 40% 30%, #ffffff, #f3efe7 50%, #e6dfd4);
            border-radius: 50% 50% 50% 0;
            opacity: 0.5;
            transform-origin: center bottom;
            animation: fall linear infinite;
            box-shadow: 0 0 10px rgba(255, 245, 220, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .petal::before {
            content: '';
            position: absolute;
            top: 20%;
            left: 15%;
            width: 30%;
            height: 35%;
            background: radial-gradient(ellipse, rgba(255, 245, 210, 0.25), transparent);
            border-radius: 50%;
            transform: rotate(-15deg);
        }
        .petal::after {
            content: '';
            position: absolute;
            bottom: 15%;
            right: 10%;
            width: 20%;
            height: 25%;
            background: radial-gradient(ellipse, rgba(255, 240, 200, 0.15), transparent);
            border-radius: 50%;
            transform: rotate(20deg);
        }

        .petal:nth-child(1) {
            left: 5%;
            animation-duration: 20s;
            animation-delay: 0s;
            width: 22px;
            height: 30px;
            opacity: 0.45;
            transform: rotate(10deg);
        }
        .petal:nth-child(2) {
            left: 15%;
            animation-duration: 26s;
            animation-delay: 3s;
            width: 32px;
            height: 42px;
            opacity: 0.30;
            transform: rotate(-8deg);
        }
        .petal:nth-child(3) {
            left: 28%;
            animation-duration: 22s;
            animation-delay: 6s;
            width: 24px;
            height: 34px;
            opacity: 0.50;
            transform: rotate(15deg);
        }
        .petal:nth-child(4) {
            left: 40%;
            animation-duration: 28s;
            animation-delay: 1s;
            width: 36px;
            height: 46px;
            opacity: 0.25;
            transform: rotate(-12deg);
        }
        .petal:nth-child(5) {
            left: 52%;
            animation-duration: 24s;
            animation-delay: 5s;
            width: 20px;
            height: 28px;
            opacity: 0.55;
            transform: rotate(5deg);
        }
        .petal:nth-child(6) {
            left: 65%;
            animation-duration: 30s;
            animation-delay: 8s;
            width: 30px;
            height: 40px;
            opacity: 0.20;
            transform: rotate(-18deg);
        }
        .petal:nth-child(7) {
            left: 78%;
            animation-duration: 23s;
            animation-delay: 2s;
            width: 26px;
            height: 36px;
            opacity: 0.40;
            transform: rotate(8deg);
        }
        .petal:nth-child(8) {
            left: 88%;
            animation-duration: 27s;
            animation-delay: 7s;
            width: 34px;
            height: 44px;
            opacity: 0.15;
            transform: rotate(-6deg);
        }
        .petal:nth-child(9) {
            left: 10%;
            animation-duration: 32s;
            animation-delay: 10s;
            width: 18px;
            height: 26px;
            opacity: 0.35;
            transform: rotate(20deg);
        }
        .petal:nth-child(10) {
            left: 72%;
            animation-duration: 19s;
            animation-delay: 4s;
            width: 26px;
            height: 34px;
            opacity: 0.45;
            transform: rotate(-10deg);
        }
        .petal:nth-child(11) {
            left: 45%;
            animation-duration: 25s;
            animation-delay: 9s;
            width: 30px;
            height: 38px;
            opacity: 0.30;
            transform: rotate(12deg);
        }
        .petal:nth-child(12) {
            left: 92%;
            animation-duration: 21s;
            animation-delay: 11s;
            width: 22px;
            height: 30px;
            opacity: 0.40;
            transform: rotate(-14deg);
        }

        @keyframes fall {
            0% {
                transform: translateY(-80px) rotate(0deg) scale(1);
                opacity: 0.6;
            }
            100% {
                transform: translateY(calc(100vh + 100px)) rotate(720deg) scale(0.4);
                opacity: 0.05;
            }
        }

        /* ===== 播放器主卡片 ===== */
        .player-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .player-card {
            background: rgba(255, 252, 248, 0.60);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border-radius: 48px;
            padding: 28px 28px 26px;
            box-shadow:
                0 24px 72px rgba(120, 140, 110, 0.18),
                0 8px 28px rgba(160, 180, 150, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.35);
            transition: all 0.3s ease;
        }

        /* ===== 专辑封面 ===== */
        .cover-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .flower-container {
            width: 180px;
            height: 180px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #faf8f5, #eef3ea);
            box-shadow:
                inset 0 -8px 28px rgba(140, 160, 130, 0.12),
                0 16px 48px rgba(140, 160, 130, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.6s ease;
            overflow: hidden;
            cursor: pointer;
            /* 双击提示 */
        }
        .flower-container::after {
            content: '🖱️ 双击换图';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.0);
            background: rgba(0, 0, 0, 0.0);
            padding: 2px 12px;
            border-radius: 20px;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 5;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .flower-container:hover::after {
            color: rgba(255, 255, 255, 0.85);
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
        }

        .flower-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            /* ===== 🌀 图片旋转核心代码 ===== */
            animation: spin 10s linear infinite;
            animation-play-state: paused;
        }

        /* 播放时恢复旋转 */
        .flower-container.playing img {
            animation-play-state: running;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        /* ===== 旋转代码结束 ===== */

        /* 播放状态微光 */
        .flower-container.playing {
            box-shadow:
                inset 0 -8px 28px rgba(140, 160, 130, 0.12),
                0 16px 56px rgba(140, 180, 120, 0.18),
                0 0 80px rgba(180, 210, 160, 0.06);
        }

        /* ===== 歌曲信息 ===== */
        .song-info {
            text-align: center;
            padding: 2px 0 6px;
        }

        .song-info .song-name {
            font-size: 21px;
            font-weight: 600;
            color: #3d4d3a;
            letter-spacing: 1px;
            font-family: 'Georgia', serif;
            transition: all 0.3s ease;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
        }

        .song-info .artist-name {
            font-size: 14px;
            color: #9aae8f;
            margin-top: 2px;
            letter-spacing: 2px;
            font-style: italic;
            font-weight: 300;
        }

        /* ===== 进度条 ===== */
        .progress-area {
            margin: 16px 0 12px;
        }

        .progress-bar {
            position: relative;
            width: 100%;
            height: 5px;
            background: rgba(200, 215, 190, 0.30);
            border-radius: 10px;
            cursor: pointer;
            overflow: hidden;
            transition: height 0.2s ease;
        }
        .progress-bar:hover {
            height: 7px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #b8c9ad, #a8bf98, #8fb07c);
            border-radius: 10px;
            transition: width 0.12s linear;
            position: relative;
        }
        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 2px 12px rgba(100, 130, 90, 0.20);
            border: 2px solid #b8c9ad;
            opacity: 0;
            transition: opacity 0.25s ease;
        }
        .progress-bar:hover .progress-fill::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #b0bea5;
            letter-spacing: 0.5px;
            font-family: 'Courier New', monospace;
        }

        /* ===== 控制按钮 ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin: 12px 0 16px;
        }

        .controls .btn {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #4d5e4a;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            box-shadow: 0 2px 12px rgba(140, 160, 130, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .controls .btn:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 28px rgba(140, 160, 130, 0.12);
        }
        .controls .btn:active {
            transform: scale(0.92);
        }

        .controls .btn-play {
            width: 60px;
            height: 60px;
            font-size: 26px;
            background: linear-gradient(145deg, #d4e4cb, #b8ccab);
            color: #ffffff;
            box-shadow: 0 6px 28px rgba(140, 180, 120, 0.22);
            border: none;
        }
        .controls .btn-play:hover {
            background: linear-gradient(145deg, #dcecd3, #c0d4b3);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 36px rgba(140, 180, 120, 0.28);
        }
        .controls .btn-play:active {
            transform: scale(0.90);
        }

        .controls .btn-like {
            color: #d4b8a8;
            font-size: 20px;
        }
        .controls .btn-like.active {
            color: #e88a7a;
        }

        .controls .btn-shuffle {
            font-size: 16px;
            color: #b0bea5;
        }
        .controls .btn-shuffle.active {
            color: #8fb07c;
        }

        /* ===== 播放列表 ===== */
        .playlist {
            margin-top: 10px;
            border-top: 1px solid rgba(200, 215, 190, 0.18);
            padding-top: 12px;
            max-height: 170px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d4dfce transparent;
        }
        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: #d4dfce;
            border-radius: 10px;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 14px 7px 16px;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }
        .playlist-item:hover {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(200, 215, 190, 0.15);
        }
        .playlist-item.active {
            background: rgba(220, 235, 210, 0.25);
            border-color: rgba(180, 205, 165, 0.20);
        }
        .playlist-item .info {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }
        .playlist-item .info .title {
            font-size: 14px;
            color: #3d4d3a;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Georgia', serif;
        }
        .playlist-item .info .artist {
            font-size: 12px;
            color: #b0bea5;
            font-style: italic;
        }
        .playlist-item .status {
            font-size: 13px;
            color: #b8c9ad;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .playlist-item.active .status {
            color: #8fb07c;
        }
        .playlist-item .status .playing-icon {
            display: none;
            animation: pulse 1.2s ease-in-out infinite;
	font-size:17px;
	  color: #pink;              /* 内部填充色 */
  	  -webkit-text-stroke: 1px white;  /* 外部描边 */
    	font-weight: bold;
        }
        .playlist-item.active .status .playing-icon {
            display: inline;
        }
        .playlist-item.active .status .index-number {
            display: none;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.2;
                transform: scale(0.8);
            }
        }

        /* ===== 底部 ===== */
        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 10px;
            border-top: 1px solid rgba(200, 215, 190, 0.12);
        }

        .player-footer .mode-tip {
            font-size: 11px;
            color: #b8c9ad;
            letter-spacing: 1px;
            font-style: italic;
        }

        .player-footer .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b0bea5;
            font-size: 13px;
        }
        .player-footer .volume-control input[type="range"] {
            width: 60px;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(200, 215, 190, 0.25);
            border-radius: 10px;
            outline: none;
            transition: background 0.2s;
        }
        .player-footer .volume-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #b8c9ad;
            cursor: pointer;
            border: 2px solid #ffffff;
            box-shadow: 0 2px 10px rgba(140, 160, 130, 0.12);
        }
        .player-footer .volume-control input[type="range"]::-moz-range-thumb {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #b8c9ad;
            cursor: pointer;
            border: 2px solid #ffffff;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .player-card {
                padding: 24px 18px 20px;
                border-radius: 32px;
            }
            .flower-container {
                width: 150px;
                height: 150px;
            }
            .song-info .song-name {
                font-size: 18px;
            }
            .controls .btn {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
            .controls .btn-play {
                width: 52px;
                height: 52px;
                font-size: 22px;
            }
            .playlist-item .info .title {
                font-size: 13px;
            }
            .player-footer .volume-control input[type="range"] {
                width: 40px;
            }
            .flower-container::after {
                font-size: 9px;
                bottom: 4px;
                padding: 1px 10px;
            }
        }

        @media (max-width: 380px) {
            .flower-container {
                width: 130px;
                height: 130px;
            }
            .controls {
                gap: 12px;
            }
        }

        /* ===== Toast 提示 ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(60, 80, 55, 0.80);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: #f5f7f0;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 14px;
            font-family: 'Georgia', serif;
            letter-spacing: 1px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 100;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.12);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- ===== 飘落花瓣 ===== -->
    <div class="petals-container" aria-hidden="true">
        <div class="petal"></div>
        <div class="petal"></div>

        // ============================================================

        ];
        let currentImageIndex = 0;

        // ============================================================

        let currentIndex = 0;
        let isPlaying = false;
        let isLiked = false;
        let isShuffled = false;
        let shuffledIndices = [];
        let shuffleIndex = 0;

        // ============================================================
        //  DOM 引用
        // ============================================================
        const audio = new Audio();
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const likeBtn = document.getElementById('likeBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const songNameEl = document.getElementById('songName');
        const artistNameEl = document.getElementById('artistName');
        const playlistEl = document.getElementById('playlist');
        const flowerContainer = document.getElementById('flowerContainer');
        const coverImage = document.getElementById('coverImage');
        const volumeSlider = document.getElementById('volumeSlider');
        const modeTip = document.getElementById('modeTip');
        const toast = document.getElementById('toast');

        let toastTimer = null;

        // ============================================================
        //  工具函数
        // ============================================================
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function showToast(msg, duration = 1800) {
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // ============================================================
        //  🖼️ 双击切换图片
        // ============================================================
        flowerContainer.addEventListener('dblclick', function(e) {
            // 防止双击触发其他事件
            e.stopPropagation();
            // 切换到下一张
            currentImageIndex = (currentImageIndex + 1) % imageList.length;
            coverImage.src = imageList[currentImageIndex];
            showToast('🖼️ 切换图片', 1200);
        });

        // ============================================================
        //  播放器核心
        // ============================================================
        function loadSong(index) {
            const song = songs[index];
            if (!song) return;
            audio.src = song.src;
            audio.load();
            songNameEl.textContent = song.title;
            artistNameEl.textContent = song.artist;
            currentTimeEl.textContent = '0:00';
            totalTimeEl.textContent = '0:00';
            progressFill.style.width = '0%';
            renderPlaylist(index);
            if (isPlaying) {
                audio.play().catch(() => {});
            }
        }

        function playSong() {
            if (!audio.src) {
                loadSong(currentIndex);
            }
            audio.play()
                .then(() => {
                    isPlaying = true;
                    playIcon.className = 'fas fa-pause';
                    flowerContainer.classList.add('playing');
                })
                .catch(() => {});
        }

        function pauseSong() {
            audio.pause();
            isPlaying = false;
            playIcon.className = 'fas fa-play';
            flowerContainer.classList.remove('playing');
        }

        function togglePlay() {
            if (isPlaying) {
                pauseSong();
            } else {
                playSong();
            }
        }

        function prevSong() {
            if (isShuffled) {
                shuffleIndex = (shuffleIndex - 1 + shuffledIndices.length) % shuffledIndices.length;
                currentIndex = shuffledIndices[shuffleIndex];
            } else {
                currentIndex = (currentIndex - 1 + songs.length) % songs.length;
            }
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            } else {
                playSong();
            }
        }

        function nextSong() {
            if (isShuffled) {
                shuffleIndex = (shuffleIndex + 1) % shuffledIndices.length;
                currentIndex = shuffledIndices[shuffleIndex];
            } else {
                currentIndex = (currentIndex + 1) % songs.length;
            }
            loadSong(currentIndex);
            if (isPlaying) {
                audio.play().catch(() => {});
            } else {
                playSong();
            }
        }

        function toggleLike() {
            isLiked = !isLiked;
            likeBtn.classList.toggle('active', isLiked);
            showToast(isLiked ? '❤️ 已收藏' : '💔 已取消收藏');
        }

        function toggleShuffle() {
            isShuffled = !isShuffled;
            shuffleBtn.classList.toggle('active', isShuffled);
            if (isShuffled) {
                const indices = songs.map((_, i) => i);
                for (let i = indices.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [indices[i], indices[j]] = [indices[j], indices[i]];
                }
                const idx = indices.indexOf(currentIndex);
                if (idx > 0) {
                    [indices[0], indices[idx]] = [indices[idx], indices[0]];
                }
                shuffledIndices = indices;
                shuffleIndex = 0;
                showToast('🔀 随机播放已开启');
                renderPlaylist(currentIndex);
            } else {
                showToast('🔁 顺序播放已恢复');
                renderPlaylist(currentIndex);
            }
            updateModeTip();
        }

        function updateModeTip() {
            modeTip.textContent = isShuffled ? '🔀 随机播放' : '♻️ 顺序播放';
        }

        // ============================================================
        //  进度条
        // ============================================================
        function updateProgress() {
            if (audio.duration && !isNaN(audio.duration)) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${Math.min(pct, 100)}%`;
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        }

        function seekTo(e) {
            const rect = progressBar.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const clamped = Math.max(0, Math.min(1, x));
            if (audio.duration && !isNaN(audio.duration)) {
                audio.currentTime = clamped * audio.duration;
            }
        }

        // ============================================================
        //  播放列表渲染
        // ============================================================
        function renderPlaylist(activeIndex) {
            const list = isShuffled ? shuffledIndices : songs.map((_, i) => i);
            playlistEl.innerHTML = '';
            list.forEach((origIdx, pos) => {
                const song = songs[origIdx];
                const li = document.createElement('div');
                li.className = `playlist-item ${origIdx === activeIndex ? 'active' : ''}`;
                li.dataset.index = origIdx;

                const info = document.createElement('div');
                info.className = 'info';
                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = song.title;
                const artist = document.createElement('div');
                artist.className = 'artist';
                artist.textContent = song.artist;
                info.appendChild(title);
                info.appendChild(artist);

                const status = document.createElement('div');
                status.className = 'status';
                if (origIdx === activeIndex && isPlaying) {
                    status.innerHTML = '<span class="playing-icon">❀</span>';
                } else {
                    status.innerHTML = `<span class="index-number">${pos + 1}</span>`;
                }

                li.appendChild(info);
                li.appendChild(status);

                li.addEventListener('click', () => {
                    if (origIdx === currentIndex && isPlaying) return;
                    currentIndex = origIdx;
                    if (isShuffled) {
                        shuffleIndex = shuffledIndices.indexOf(currentIndex);
                        if (shuffleIndex === -1) {
                            const idx = shuffledIndices.indexOf(currentIndex);
                            shuffleIndex = idx !== -1 ? idx : 0;
                        }
                    }
                    loadSong(currentIndex);
                    if (isPlaying) {
                        audio.play().catch(() => {});
                    } else {
                        playSong();
                    }
                });

                playlistEl.appendChild(li);
            });

            const activeItem = playlistEl.querySelector('.playlist-item.active');
            if (activeItem) {
                activeItem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        // ============================================================
        //  音量
        // ============================================================
        volumeSlider.addEventListener('input', () => {
            const val = parseInt(volumeSlider.value);
            audio.volume = val / 100;
        });

        // ============================================================
        //  事件绑定
        // ============================================================
        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', prevSong);
        nextBtn.addEventListener('click', nextSong);
        likeBtn.addEventListener('click', toggleLike);
        shuffleBtn.addEventListener('click', toggleShuffle);

        progressBar.addEventListener('click', seekTo);

        let isDragging = false;
        progressBar.addEventListener('mousedown', (e) => {
            isDragging = true;
            seekTo(e);
        });
        document.addEventListener('mousemove', (e) => {
            if (isDragging) seekTo(e);
        });
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });

        progressBar.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            seekTo({ clientX: touch.clientX });
        });
        progressBar.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            seekTo({ clientX: touch.clientX });
        });

        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('ended', () => {
            if (isShuffled) {
                shuffleIndex = (shuffleIndex + 1) % shuffledIndices.length;
                currentIndex = shuffledIndices[shuffleIndex];
            } else {
                currentIndex = (currentIndex + 1) % songs.length;
            }
            loadSong(currentIndex);
            audio.play().catch(() => {});
            isPlaying = true;
            playIcon.className = 'fas fa-pause';
            flowerContainer.classList.add('playing');
        });

        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            }
            if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextSong();
            }
            if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevSong();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) return;
            if (isPlaying && audio.paused) {
                audio.play().catch(() => {});
            }
        });

        // ============================================================
        //  初始化
        // ============================================================
        function init() {
            audio.volume = 75 / 100;
            volumeSlider.value = 75;
            loadSong(0);
            renderPlaylist(0);
            updateModeTip();
            flowerContainer.classList.remove('playing');
            // 确保封面图片显示第一张
            coverImage.src = imageList[0];
            setTimeout(() => {
                showToast('🎉🎉🎉生日快乐🍰🍰🍰', 2200);
            }, 500);
            audio.addEventListener('error', () => {
                showToast('⚠️ 音频加载失败，请检查网络或更换歌曲', 3000);
            });
        }

        // 暴露到控制台方便调试
        window.__player = {
            songs,
            currentIndex,
            audio,
            play: () => playSong(),
            pause: () => pauseSong(),
            next: nextSong,
            prev: prevSong,
            togglePlay,
            toggleShuffle,
            toggleLike,
            imageList,
            currentImageIndex,
            switchImage: () => {
                currentImageIndex = (currentImageIndex + 1) % imageList.length;
                coverImage.src = imageList[currentImageIndex];
                showToast('🖼️ 切换图片', 1200);
            }
        };

        init();
    </script>

</body>
</html>
